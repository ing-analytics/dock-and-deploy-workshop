services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: workshop
    # Docker checks every 2 seconds whether PostgreSQL accepts connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      # `db` is the name of the service above: Compose makes it a hostname
      SERVER: db:5432
      DATABASE: workshop
      USERNAME: workshop
      PASSWORD: workshop
    # Start the api only once the healthcheck of db reports "healthy"
    depends_on:
      db:
        condition: service_healthy
