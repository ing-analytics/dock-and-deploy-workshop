apiVersion: batch/v1
kind: Job
metadata:
  name: api-request-job
spec:
  template:
    spec:
      containers:
      - name: api-request-container
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        # /bin/sh is BusyBox ash, which has no {1..3} brace expansion
        args: ["for i in 1 2 3; do curl -sS -X POST http://nginx-service/counter; echo; done"]
      restartPolicy: Never
  backoffLimit: 4
  