# Increments the counter of the counter-api three times (deploy 1-deploy.yaml first)
apiVersion: batch/v1
kind: Job
metadata:
  name: api-request-job
spec:
  template:
    spec:
      containers:
      - name: api-request-container
        image: curlimages/curl:8.11.1
        command: ["/bin/sh", "-c"]
        # `counter-service` is the name of the Service from 1-deploy.yaml
        args: ["for i in 1 2 3; do curl -sS -X POST http://counter-service/counter; echo; done"]
      restartPolicy: Never
  backoffLimit: 4
