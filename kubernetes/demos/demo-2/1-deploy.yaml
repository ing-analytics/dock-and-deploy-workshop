# Build the image first: docker build -t counter-api:v1 .
# (with kind, also run: kind load docker-image counter-api:v1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    run: kubernetes-demo
spec:
  selector:
    matchLabels:
      run: kubernetes-demo
  template:
    metadata:
      labels:
        run: kubernetes-demo
    spec:
      containers:
        - name: counter-api
          image: counter-api:v1
          # Use the locally built image instead of pulling it from a registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: COUNTER_APP_FILEPATH
              value: "/app/counter/counter.txt"
          volumeMounts:
            - name: counter-volume
              mountPath: /app/counter
      volumes:
        - name: counter-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: counter-service
spec:
  selector:
    run: kubernetes-demo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
