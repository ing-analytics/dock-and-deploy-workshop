apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    run: kubernetes-demo
spec:
  selector:
    matchLabels:
      run: kubernetes-demo
  template:
    metadata:
      labels:
        run: kubernetes-demo
    spec:
      containers:
        - name: counter-api
          # Built locally: docker build -t counter-api:v1 kubernetes/demos/demo-2
          image: counter-api:v1
          # Use the local image instead of trying to pull it from a registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080 # fastapi listens on 8080, see Dockerfile
          env:
            - name: COUNTER_APP_FILEPATH
              value: "/app/counter/counter.txt"
          volumeMounts:
            - name: counter-volume
              mountPath: /app/counter
      volumes:
        - name: counter-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    run: kubernetes-demo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
